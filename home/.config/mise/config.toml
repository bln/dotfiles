#:schema https://mise.jdx.dev/schema/mise.json
# Single source of truth for tools, packages, dotfiles, and macOS setup.

min_version = "2026.9.12"

[settings]
lockfile = true
dotfiles.root = "~/dotfiles/home"
dotfiles.default_mode = "symlink"
python.uv_venv_auto = "create|source"
# Let a release settle before adopting it, except for the fast-moving agent
# CLIs we deliberately track at the bleeding edge.
minimum_release_age = "2d"
minimum_release_age_excludes = ["claude-code", "codex", "pi"]

[env]
# These are mise/package-manager settings, not interactive shell state.
MISE_BREW_CASK_OPT_APPDIR = "{{env.HOME}}/Applications"
# ~/.local/bin is required for non-interactive mise tasks to resolve the
# managed Python and helper commands; .zshenv deduplicates it for shells.
_.path = ["{{env.HOME}}/.local/bin", "/opt/homebrew/bin", "/opt/homebrew/sbin"]

[tools]
node = "lts"
uv = "latest"

atuin = "latest"
zoxide = "latest"
fzf = "latest"
starship = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
jq = "latest"
ripgrep = "latest"
superfile = "latest"
gh = "latest"
lazygit = "latest"
gitui = "latest"
neovim = "latest"
tree-sitter = "latest"
shellcheck = "latest"
claude-code = "latest"
codex = "latest"
pi = "latest"

[bootstrap.packages]
"brew:git" = "latest"
"brew:mas" = "latest"

"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:typora" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

"mas:1365531024" = { os = "macos" }  # 1Blocker
"mas:6739955340" = { os = "macos" }  # Markdown Preview
"mas:1592917505" = { os = "macos" }  # Noir
"mas:6720708363" = { os = "macos" }  # Obsidian Web Clipper
"mas:6471380298" = { os = "macos" }  # StopTheMadness Pro

[bootstrap.macos.dock]
tilesize = 48
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
show_extensions_warning = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleInterfaceStyleSwitchesAutomatically = true, NSTableViewDefaultSizeMode = 3 }
"com.apple.finder" = { FXDefaultSearchScope = "SCcf", _FXSortFoldersFirst = true }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
"com.apple.dock" = { "autohide-delay" = 0.0, "autohide-time-modifier" = 0.2 }
"com.apple.spaces" = { "spans-displays" = false }
"com.apple.TextEdit" = { RichText = 0, PlainTextEncoding = 4, PlainTextEncodingForWrite = 4 }
"com.apple.ActivityMonitor" = { OpenMainWindow = true, ShowCategory = 0, SortColumn = "CPUUsage" }

[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"

[dotfiles]
"~/.zshenv" = {}
"~/.config/zsh/.zshrc" = {}
"~/.config/zsh/.zprofile" = {}
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/starship.toml" = {}
"~/.config/npm/npmrc" = {}
"~/.config/uv/uv.toml" = {}
"~/.config/ghostty" = {}
"~/.config/nvim" = {}
"~/.config/nvim-lazyvim" = {}
"~/.config/nvim-kickstart" = {}

"~/.config/mise/config.toml" = {}
"~/.config/mise/mise.lock" = {}
# Agent instructions and skills are copy-managed because their consumers write
# in place. The explicit sources keep agent runtime state outside the repo.
"~/.config/pi/agent/AGENTS.md" = { source = "~/dotfiles/home/.config/pi/agent/AGENTS.md", mode = "copy" }
"~/.config/codex/AGENTS.md" = { source = "~/dotfiles/home/.config/codex/AGENTS.md", mode = "copy" }
"~/.agents/skills" = { source = "~/dotfiles/home/.config/skills", mode = "copy", manifest = "git" }
"~/.config/claude/CLAUDE.md" = { source = "~/dotfiles/home/.config/claude/CLAUDE.md", mode = "copy" }
"~/.config/claude/skills" = { source = "~/dotfiles/home/.config/claude/skills", mode = "copy", manifest = "git" }

# VS Code profile content (settings.json, keybindings.json, tasks.json,
# snippets/, and per-profile extension lists) is NOT a [dotfiles] entry: VS Code
# rewrites those files in place (orphaning symlinks) and named-profile files
# live under an opaque storage location that this table cannot express. The
# `scripts/vscode-profiles` mini-CLI owns the whole tree in copy mode instead -
# `apply` pushes repo->live, `pull` captures live->repo, `check` reports drift.
