#:schema https://mise.jdx.dev/schema/mise.json

# Canonical global machine configuration.
# Deployed to ~/.config/mise/config.toml through home/.

min_version = "2026.11.5"


# -----------------------------------------------------------------------------
# Mise
# -----------------------------------------------------------------------------

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
self_update.auto = true

# Resolve the deployed config symlink back to this repository's home/ tree.
dotfiles.root = "{{ config_source | canonicalize | dirname }}/../.."

disable_backends = [
  "asdf",
  "conda",
  "dotnet",
  "forgejo",
  "gem",
  "gitlab",
  "s3",
  "ubi",
  "vfox",
]

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'


# -----------------------------------------------------------------------------
# Dotfiles
# -----------------------------------------------------------------------------

[dotfile_groups.home]
root = "."
target = "~"
mode = "symlink-each"
manifest = "git"
relative = true
exclude = ["Library/Application Support/rtk/config.toml"]

[dotfiles]
"~/Library/Application Support/rtk/config.toml/excludes" = { merge = true }


# -----------------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------------

[env]

_.path = [
  "~/.local/bin",
  { path = [
    "/opt/homebrew/bin",
    "/opt/homebrew/sbin",
  ], position = "append" },
] # Append Homebrew after Mise-managed tools and before inherited PATH.

# Keep cask applications in the user-owned Applications directory.
MISE_BREW_CASK_OPT_APPDIR = "$HOME/Applications"


# -----------------------------------------------------------------------------
# Tools
# -----------------------------------------------------------------------------

[tools]
node = "lts"
uv = "latest"


# -----------------------------------------------------------------------------
# Bootstrap packages
# -----------------------------------------------------------------------------

[bootstrap.packages]

# Host prerequisites.
"brew:git" = "latest"

# CLI essentials.
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git-delta" = "latest"
"brew:gitui" = "latest"
"brew:jq" = "latest"
"brew:ripgrep" = "latest"
"brew:shellcheck" = "latest"
"brew:tokei" = "latest"
"brew:wget" = "latest"
"brew:zoxide" = "latest"

# Additional CLI tools.
"brew:agent-browser" = "latest"
"brew:mole" = "latest"
"brew:rtk" = "latest"
"brew:starship" = "latest"

# Coding agents and editors.
"brew-cask:chatgpt" = "latest"
"brew-cask:claude-code@latest" = "latest"
"brew-cask:codex" = "latest"
"brew:neovim" = "latest"
"brew:pi-coding-agent" = "latest"

# Interactive Zsh plugins.
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"

# Terminal and desktop applications.
"brew-cask:ghostty" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:typora" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zed" = "latest"

# Fonts.
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"


# -----------------------------------------------------------------------------
# macOS
# -----------------------------------------------------------------------------

[bootstrap.macos.dock]
tilesize = 48
autohide = true
show_recents = false
mru_spaces = false
autohide_delay = 0.0
autohide_time_modifier = 0.2

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
show_extensions_warning = false
sort_folders_first = true

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = {
  NSTableViewDefaultSizeMode = 3,
}

"com.apple.finder" = {
  FXDefaultSearchScope = "SCcf",
}

"com.apple.desktopservices" = {
  DSDontWriteNetworkStores = true,
DSDontWriteUSBStores = true,
}

"com.apple.spaces" = {
  "spans-displays" = false,
}

"com.apple.ActivityMonitor" = {
  OpenMainWindow = true,
ShowCategory = 0,
SortColumn = "CPUUsage",
}

[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"


# -----------------------------------------------------------------------------
# Tasks
# -----------------------------------------------------------------------------

[tasks.bootstrap]
description = "Ensure uv's default stable Python is installed"
run = 'uv python find --no-project --managed-python >/dev/null 2>&1 || uv python install --default'

[tasks.update]
description = "Update mise tools, packages, plugins, and dotfiles"
run = "mise self-update --yes && mise bootstrap --upgrade --prune-dotfiles --yes"

[tasks.cleanup]
description = "Prune mise tools, packages, plugins, and dotfiles"
run = [
  "mise prune",
  "mise bootstrap packages prune --manager brew-cask --force",
]
