#:schema https://mise.jdx.dev/schema/mise.json
# Single source of truth for tools, packages, dotfiles, and macOS setup.

min_version = "2026.9.9"

[settings]
lockfile = true
dotfiles.root = "~/dotfiles/home"
dotfiles.default_mode = "symlink"
python.uv_venv_auto = "create|source"
# Let a release settle before adopting it, except for the fast-moving agent
# CLIs we deliberately track at the bleeding edge.
minimum_release_age = "2d"
minimum_release_age_excludes = ["claude-code", "codex", "pi"]

[env]
# User environment formerly split across .zshrc/.zshenv.
SHELL_SESSIONS_DISABLE = "1"
EDITOR = "nvim"
VISUAL = "nvim"
PAGER = "less -FRX"
LANG = "en_US.UTF-8"
ENABLE_PROMPT_CACHING_1H = "1"
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
NPM_CONFIG_USERCONFIG = "{{env.XDG_CONFIG_HOME}}/npm/npmrc"
MISE_BREW_CASK_OPT_APPDIR = "{{env.HOME}}/Applications"
_.path = ["{{env.HOME}}/.local/bin", "/opt/homebrew/bin"]

[plugins]
# No-op local backend so VS Code extensions can be declared as [tools] entries
# below (vscode-ext:<id>). mise auto-links this on `mise install`.
# Uses env.HOME for portability - no hardcoded username.
vscode-ext = "{{env.HOME}}/.config/mise/plugins/vscode-ext"

[tools]
node = "lts"
uv = "latest"

atuin = "latest"
zoxide = "latest"
fzf = "latest"
starship = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
jq = "latest"
ripgrep = "latest"
superfile = "latest"
gh = "latest"
lazygit = "latest"
gitui = "latest"
neovim = "latest"
shellcheck = "latest"
claude-code = "latest"
codex = "latest"
pi = "latest"

# VS Code extensions (declared here, synced by apply-vscode-extensions.sh).
# language support
"vscode-ext:golang.go" = "latest"
"vscode-ext:ms-python.debugpy" = "latest"
"vscode-ext:ms-python.python" = "latest"
"vscode-ext:ms-python.vscode-pylance" = "latest"
"vscode-ext:ms-python.vscode-python-envs" = "latest"
"vscode-ext:ms-vscode.makefile-tools" = "latest"
"vscode-ext:tombi-toml.tombi" = "latest"
"vscode-ext:mechatroner.rainbow-csv" = "latest"
# AI
"vscode-ext:anthropic.claude-code" = "latest"
"vscode-ext:openai.chatgpt" = "latest"
# tooling
"vscode-ext:hverlin.mise-vscode" = "latest"
"vscode-ext:typora.typora-open-in-typora" = "latest"
# themes and icons
"vscode-ext:github.github-vscode-theme" = "latest"
"vscode-ext:pkief.material-icon-theme" = "latest"
"vscode-ext:zhuangtongfa.material-theme" = "latest"

[bootstrap.packages]
"brew:git" = "latest"
"brew:mas" = "latest"

"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:typora" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

"mas:1365531024" = { os = "macos" }  # 1Blocker
"mas:6739955340" = { os = "macos" }  # Markdown Preview
"mas:1592917505" = { os = "macos" }  # Noir
"mas:6720708363" = { os = "macos" }  # Obsidian Web Clipper
"mas:6471380298" = { os = "macos" }  # StopTheMadness Pro

[bootstrap.macos.dock]
tilesize = 48
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
show_extensions_warning = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleInterfaceStyleSwitchesAutomatically = true, NSTableViewDefaultSizeMode = 3 }
"com.apple.finder" = { FXDefaultSearchScope = "SCcf", _FXSortFoldersFirst = true }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
"com.apple.dock" = { "autohide-delay" = 0.0, "autohide-time-modifier" = 0.2 }
"com.apple.spaces" = { "spans-displays" = false }
"com.apple.TextEdit" = { RichText = 0, PlainTextEncoding = 4, PlainTextEncodingForWrite = 4 }
"com.apple.ActivityMonitor" = { OpenMainWindow = true, ShowCategory = 0, SortColumn = "CPUUsage" }

[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"

# Interactive aliases. These require `mise activate zsh`; tasks/CI should use mise tasks.
[shell_alias]
".." = "cd .."
"..." = "cd ../.."
"...." = "cd ../../.."
c = "clear"
q = "exit"
path = '''printf '%s\n' "${PATH//:/\n}"'''
reload = "exec zsh"
zshrc = '''nvim "$ZDOTDIR/.zshrc"'''
vim = "nvim"
cp = "cp -i"
mv = "mv -i"
rm = "rm -i"
mkdir = "mkdir -p"
l = "eza --icons=auto"
ll = "eza -lh --icons=auto --git"
la = "eza -lah --icons=auto --git"
tree = "eza --tree --icons=auto"
cat = "bat --style=plain"
# Run dotfiles repo tasks from anywhere: dot run update, dot run verify, etc.
dot = '''mise -C "${DOTFILES_DIR:-$HOME/dotfiles}"'''

# directories
dl = "cd ~/Downloads"
dt = "cd ~/Desktop"
dc = "cd ~/Documents"

v = "nvim"

[dotfiles]
"~/.zshenv" = {}
"~/.config/zsh/.zshrc" = {}
"~/.config/zsh/.zprofile" = {}
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/starship.toml" = {}
"~/.config/npm/npmrc" = {}
"~/.config/uv/uv.toml" = {}
"~/.config/ghostty" = {}
"~/.config/nvim" = {}

"~/.claude/CLAUDE.md" = { source = "~/dotfiles/home/.agents/AGENTS.md" }
"~/.claude/skills" = { source = "~/dotfiles/home/.agents/skills" }
"~/.codex/AGENTS.md" = { source = "~/dotfiles/home/.agents/AGENTS.md" }
"~/.agents/skills" = { source = "~/dotfiles/home/.agents/skills" }

"~/.config/mise/config.toml" = {}
"~/.config/mise/mise.lock" = {}
# VS Code rewrites settings.json in place (Settings UI, extensions), so a
# symlink gets orphaned into a divorced regular file. Manage it in copy mode
# instead: apply seeds the live file from the repo, and app-written changes are
# pulled back with `mise dotfiles add --changed` (or `dot run update`).
"~/Library/Application Support/Code/User/settings.json" = { source = "~/dotfiles/home/.config/vscode/settings.json", mode = "copy" }
