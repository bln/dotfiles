#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.5"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
self_update.auto = true
disable_backends = [
  "asdf",
  "conda",
  "dotnet",
  "forgejo",
  "gem",
  "gitlab",
  "s3",
  "ubi",
  "vfox",
]

dotfiles.root = "{{ config_source | canonicalize | dirname }}/../.." #<repo>

[env]
_.path = [
  "~/.local/bin",
  { path = [
    "/opt/homebrew/bin",
    "/opt/homebrew/sbin",
  ], position = "append" },
]

MISE_BREW_CASK_OPT_APPDIR = "$HOME/Applications"

[dotfile_groups.home]
root = "."
manifest = "git"
relative = true
exclude = [
  "Library/Application Support/rtk/config.toml",
  ".claude/settings.json",
  ".pi/agent/settings.json",
]

[dotfile_groups.home.entries]
"~/.codex/AGENTS.md" = { source = ".agents/AGENTS.md", mode = "copy" }
"~/.claude/CLAUDE.md" = { source = ".agents/AGENTS.md", mode = "copy" }
"~/.pi/agent/AGENTS.md" = { source = ".agents/AGENTS.md", mode = "copy" }

[dotfiles]
"~/Library/Application Support/rtk/config.toml/excludes" = { merge = true }
"~/.claude/settings.json/settings" = { merge = true }
"~/.pi/agent/settings.json/settings" = { merge = true }

[tools]
node = "lts"
uv = "latest"

[bootstrap.packages]
"brew:git" = "latest"
"brew:bat" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:jq" = "latest"
"brew:ripgrep" = "latest"
"brew:shellcheck" = "latest"
"brew:zoxide" = "latest"
"brew:agent-browser" = "latest"
"brew:mole" = "latest"
"brew:rtk" = "latest"
"brew:starship" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

[bootstrap.macos.dock]
tilesize = 48
autohide = true
show_recents = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
sort_folders_first = true

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = { NSTableViewDefaultSizeMode = 3 }

"com.apple.finder" = { FXDefaultSearchScope = "SCcf" }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
"com.apple.spaces" = { "spans-displays" = false }
"com.apple.ActivityMonitor" = { OpenMainWindow = true, ShowCategory = 0, SortColumn = "CPUUsage" }

[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"

[tasks.bootstrap]
description = "Ensure uv's default stable Python and coding agents are installed"
run = [
  "uv python find --no-project --managed-python >/dev/null 2>&1 || uv python install --default",
  "command -v claude >/dev/null 2>&1 || curl -fsSL https://claude.ai/install.sh | bash",
  "command -v pi >/dev/null 2>&1 || curl -fsSL https://pi.dev/install.sh | sh",
  "command -v codex >/dev/null 2>&1 || curl -fsSL https://chatgpt.com/codex/install.sh | sh",
]

[tasks.update]
run = [
  "mise self-update --yes",
  "mise bootstrap --upgrade --prune-dotfiles --yes",
  "claude update",
  "pi update --all",
  "codex update",
]

[tasks.cleanup]
description = "Prune mise tools, packages, plugins, and dotfiles"
run = [
  "mise prune",
  "mise bootstrap packages prune --manager brew-cask --force --yes",
  "mise bootstrap packages prune --yes",
]
