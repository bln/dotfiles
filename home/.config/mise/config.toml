#:schema https://mise.jdx.dev/schema/mise.json
# Canonical global machine configuration.
# This file is deployed to ~/.config/mise/config.toml through home/.

min_version = "2026.10.24"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
self_update.auto = true
# Resolve the deployed config symlink back to this repository's home/ tree.
dotfiles.root = "{{ config_source | canonicalize | dirname }}/../.."
disable_backends = [
  "asdf",
  "conda",
  "dotnet",
  "forgejo",
  "gem",
  "gitlab",
  "s3",
  "ubi",
  "vfox",
]

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[dotfile_groups.home]
root = "."
target = "~"
mode = "symlink-each"
manifest = "git"
relative = true

[dotfiles]
"~/.config/git/identity-personal" = { permissions = "0600" }
"~/.config/git/identity-work" = { permissions = "0600" }

[env]
# Append Homebrew after Mise-managed tools and before inherited PATH.
_.path = [
  { path = ["/opt/homebrew/bin", "/opt/homebrew/sbin"], position = "append" },
]

# Zsh and tool defaults shared by Mise-activated shells and tasks.
EDITOR = "nvim"
VISUAL = "nvim"
GIT_EDITOR = "nvim"
NPM_CONFIG_USERCONFIG = { default = "${XDG_CONFIG_HOME:-$HOME/.config}/npm/npmrc" }
PAGER = { default = "less -FRX" }
LANG = "en_US.UTF-8"
CLICOLOR = "1"
LSCOLORS = "ExGxFxDxCxBxBxCxCxExDx"
EZA_COLORS = 'fi=38;2;171;178;191:di=38;2;97;175;239:ln=38;2;86;182;194:ex=38;2;152;195;121:da=38;2;229;192;123:sn=38;2;92;99;112'
FZF_DEFAULT_OPTS = '--height=40% --layout=reverse --border --info=inline --color=fg:#abb2bf,bg:#282c34,hl:#61afef,fg+:#abb2bf,bg+:#5c6370,hl+:#61afef,info:#56b6c2,prompt:#c678dd,pointer:#c678dd,marker:#98c379,spinner:#56b6c2,header:#5c6370,border:#5c6370'
FZF_CTRL_T_COMMAND = 'fd --type f --hidden --follow --exclude .git --color=never'
FZF_ALT_C_COMMAND = 'fd --type d --hidden --follow --exclude .git --color=never'
FZF_CTRL_T_OPTS = "--preview 'bat --color=always --theme=OneHalfDark --style=numbers --line-range=:500 {}'"

# Keep cask applications in the user-owned Applications directory.
MISE_BREW_CASK_OPT_APPDIR = "$HOME/Applications"

[shell_alias]
# Listing aliases.
ls = 'command ls -G'
l = 'eza --long --group-directories-first --icons=auto --color=auto'
ll = 'eza --long --all --group-directories-first --icons=auto --color=auto --git'
la = 'eza --all --group-directories-first --icons=auto --color=auto'
lla = 'eza --long --all --group-directories-first --icons=auto --color=auto --git'
tree = 'eza --tree --level=2 --group-directories-first --git-ignore --icons=auto --color=auto'
bat = 'command bat --theme=OneHalfDark --style=numbers,changes,header --paging=auto'

# General and editor shortcuts.
q = 'exit'
c = 'clear'
v = 'nvim'
cc = 'z'
dc = 'z'
cxyolo = 'codex --dangerously-bypass-approvals-and-sandbox'
cxauto = 'codex --approve-for-me'
ec = '$EDITOR $ZDOTDIR/.zshrc'
sc = 'source $ZDOTDIR/.zshrc'
mdot = 'mise dot apply --force --yes'
mu = 'mise self-update --yes && mise bootstrap --upgrade --yes'

# Git and workflow shortcuts.
gcm = 'git switch "$(git main-branch)" && git pull'
gpf = 'git push --force-with-lease --force-if-includes'
prc = 'gh pr create --web'
prv = 'gh pr view --web'
kc = 'kubectl config use-context'
cbc = 'pbcopy'
cbp = 'pbpaste'
".." = 'cd ..'
"..." = 'cd ../..'

[tools]
# Managed runtimes.
node = "lts"
uv = "latest"

[bootstrap.packages]
# Required host package.
"brew:git" = "latest"

# Command-line tools.
"brew:jq" = "latest"
"brew:wget" = "latest"
"brew:bat" = "latest"
"brew:git-delta" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:gitui" = "latest"
"brew:ripgrep" = "latest"
"brew:rtk" = "latest"
"brew:starship" = "latest"
"brew:tokei" = "latest"
"brew:shellcheck" = "latest"
"brew:mole" = "latest"
"brew:zoxide" = "latest"
"brew:agent-browser" = "latest"

# Coding agents and editors.
"brew-cask:claude-code@latest" = "latest"
"brew-cask:codex" = "latest"
"brew:neovim" = "latest"
"brew:pi-coding-agent" = "latest"

# Interactive Zsh plugins.
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"

# Mise cask identifiers use the brew-cask:<token> form.
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:typora" = "latest"
"brew-cask:obsidian" = "latest"

[bootstrap.macos.dock]
tilesize = 48
autohide = true
show_recents = false
mru_spaces = false
autohide_delay = 0.0
autohide_time_modifier = 0.2

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
show_extensions_warning = false
sort_folders_first = true

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = {
NSTableViewDefaultSizeMode = 3,
}

"com.apple.finder" = {
  FXDefaultSearchScope = "SCcf",
}

"com.apple.desktopservices" = {
  DSDontWriteNetworkStores = true,
DSDontWriteUSBStores = true,
}

"com.apple.spaces" = {
  "spans-displays" = false,
}

"com.apple.ActivityMonitor" = {
  OpenMainWindow = true,
ShowCategory = 0,
SortColumn = "CPUUsage",
}

[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"

[tasks.bootstrap]
description = "Ensure uv's default stable Python is installed"
run = 'uv python find --no-project --managed-python >/dev/null 2>&1 || uv python install --default'

[tasks.update]
description = "Update mise tools, packages, plugins, and dotfiles"
run = "mise self-update --yes && mise bootstrap --upgrade --prune-dotfiles --yes"
