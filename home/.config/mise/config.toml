#:schema https://mise.jdx.dev/schema/mise.json
# Single source of truth for tools, packages, dotfiles, and macOS setup.

min_version = "2026.9.5"

[tools]
node = "lts"
uv = "latest"

[settings]
lockfile = true
lockfile_mode = "generate"   # record all platforms in one pass (v2026.9.5+)
dotfiles.root = "~/dotfiles/home"
dotfiles.default_mode = "symlink"
python.uv_venv_auto = "create|source"

[env]
# User environment formerly split across .zshrc/.zshenv.
EDITOR = "nvim"
VISUAL = "nvim"
PAGER = "less -FRX"
LANG = "en_US.UTF-8"
ENABLE_PROMPT_CACHING_1H = "1"
PI_CACHE_RETENTION = "long"
NPM_CONFIG_USERCONFIG = "{{env.XDG_CONFIG_HOME}}/npm/npmrc"
_.path = [
  "{{env.HOME}}/.local/bin",
  "/opt/homebrew/bin",
  "/opt/homebrew/sbin",
]

# Interactive aliases. These require `mise activate zsh`; tasks/CI should use mise tasks.
[shell_alias]
".." = "cd .."
"..." = "cd ../.."
"...." = "cd ../../.."
c = "clear"
q = "exit"
path = '''printf '%s\n' "${PATH//:/\n}"'''
reload = "exec zsh"
zshrc = '''nvim "$ZDOTDIR/.zshrc"'''
vim = "nvim"
cp = "cp -i"
mv = "mv -i"
rm = "rm -i"
mkdir = "mkdir -p"
ls = "eza --icons=auto"
ll = "eza -lh --icons=auto --git"
la = "eza -lah --icons=auto --git"
tree = "eza --tree --icons=auto"
cat = "bat --style=plain"

# Shared host packages. `latest` means present; upgrades are explicit with
# `mise bootstrap packages upgrade`.
[bootstrap.packages]
"brew:git" = "latest"
"brew:mas" = "latest"
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:jq" = "latest"
"brew:ripgrep" = "latest"
"brew:tokei" = "latest"
"brew:zoxide" = "latest"
"brew:starship" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew:gh" = "latest"
"brew:gitui" = "latest"
"brew:mole" = "latest"
"brew:neovim" = "latest"
"brew:pi-coding-agent" = "latest"
"brew:shellcheck" = "latest"
"brew:pandoc" = "latest"
"brew:typst" = "latest"

"brew-cask:claude-code" = { os = "macos" }
"brew-cask:codex" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }
"brew-cask:font-jetbrains-mono" = { os = "macos" }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }
"brew-cask:coconutbattery" = { os = "macos" }
"brew-cask:keka" = { os = "macos" }
"brew-cask:bloom" = { os = "macos" }
"brew-cask:smoothcsv" = { os = "macos" }
"brew-cask:typora" = { os = "macos" }
"brew-cask:iina" = { os = "macos" }

"mas:1365531024" = { os = "macos" } # 1Blocker
"mas:6739955340" = { os = "macos" } # Markdown Preview
"mas:1592917505" = { os = "macos" } # Noir
"mas:6720708363" = { os = "macos" } # Obsidian Web Clipper
"mas:6471380298" = { os = "macos" } # StopTheMadness Pro

[bootstrap.macos.dock]
tilesize = 48
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
show_extensions_warning = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleInterfaceStyleSwitchesAutomatically = true, NSTableViewDefaultSizeMode = 3 }
"com.apple.finder" = { FXDefaultSearchScope = "SCcf", _FXSortFoldersFirst = true }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
"com.apple.dock" = { "autohide-delay" = 0.0, "autohide-time-modifier" = 0.2 }
"com.apple.spaces" = { "spans-displays" = false }
"com.apple.TextEdit" = { RichText = 0, PlainTextEncoding = 4, PlainTextEncodingForWrite = 4 }
"com.apple.ActivityMonitor" = { OpenMainWindow = true, ShowCategory = 0, SortColumn = "CPUUsage" }

[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"

[dotfiles]
"~/.zshenv" = {}
"~/.config/zsh/.zshrc" = {}
"~/.config/zsh/.zprofile" = {}
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/homebrew/Brewfile" = {}
"~/.config/starship.toml" = {}
"~/.config/npm/npmrc" = {}
"~/.config/uv/uv.toml" = {}
"~/.config/vscode/extensions.txt" = {}
"~/.config/ghostty" = {}
"~/.config/nvim" = {}

"~/.claude/CLAUDE.md" = { source = "~/dotfiles/home/.agents/AGENTS.md" }
"~/.claude/skills" = { source = "~/dotfiles/home/.agents/skills" }
"~/.pi/agent/AGENTS.md" = { source = "~/dotfiles/home/.agents/AGENTS.md" }
"~/.pi/agent/extensions/friendly-footer.ts" = {}
"~/.codex/AGENTS.md" = { source = "~/dotfiles/home/.agents/AGENTS.md" }
"~/.agents/skills" = { source = "~/dotfiles/home/.agents/skills" }

"~/.config/mise/config.toml" = {}
"~/.config/mise/mise.lock" = {}
"~/.config/mise/tasks" = {}
"~/Library/Application Support/Code/User/settings.json" = { source = "~/dotfiles/home/.config/vscode/settings.json" }

[tasks.bootstrap]
description = "finish bootstrap after native packages, dotfiles, and tools are applied"
run = [
  # VS Code extensions managed via plain manifest + script (replaces Brewfile).
  'bash "{{ env.DOTFILES_DIR | default(value=env.HOME ~ "/dotfiles") }}/scripts/apply-vscode-extensions.sh"',
  "uv python install --default --preview-features python-install-default",
]

# ── update sub-tasks ───────────────────────────────────────────────────────────
# Split so partial failures don't block unrelated upgrades, and individual
# components can be updated independently (e.g., `mise run update:tools`).

[tasks."update:mise"]
description = "update mise itself"
run = "mise self-update --yes"

[tasks."update:tools"]
description = "upgrade mise-managed tools and regenerate lockfile"
run = ["mise upgrade", "mise lock"]

[tasks."update:packages"]
description = "upgrade native host packages and VS Code extensions"
run = [
  "mise bootstrap packages upgrade",
  'bash "{{ env.DOTFILES_DIR | default(value=env.HOME ~ "/dotfiles") }}/scripts/apply-vscode-extensions.sh"',
]

[tasks."update:python"]
description = "upgrade uv-managed Python"
run = "uv python upgrade"

[tasks."update:dotfiles"]
description = "reapply dotfile symlinks"
run = "mise dotfiles apply"

[tasks.update]
description = "upgrade everything, reapply dotfiles, then audit"
interactive = true
depends = [
  "update:mise",
  "update:tools",
  "update:packages",
  "update:python",
  "update:dotfiles",
]
run = "mise run audit"

# Global entry point so you can audit the dotfiles from any directory. The real
# checks live in the repo-local mise.toml `verify` task (they need the repo cwd
# for lint/test); this delegates via -C, the same trick `update` uses. Gives one
# place to `update` and `audit` without switching into the repo.
[tasks.audit]
description = "audit the dotfiles machine state from anywhere (delegates to the repo's verify)"
run = 'mise -C "{{ env.DOTFILES_DIR | default(value=env.HOME ~ "/dotfiles") }}" verify'

[tasks.reset-claude]
description = "Clear all Claude Code project sessions"
run = "claude project purge --all"

# reset-codex is a file task: home/.config/mise/tasks/reset-codex. Its keep-list
# guards auth/config from deletion (data-loss risk), so it lives as a real script
# that tests/run.sh exercises against a CODEX_HOME sandbox.

[tasks.reset-pi]
description = "Clear all Pi coding-agent sessions"
run = "rm -rf \"$HOME/.pi/agent/sessions\""

[tasks.reset-all]
description = "Clear all Claude Code, Codex, and Pi sessions"
depends = [
  "reset-claude",
  "reset-codex",
  "reset-pi",
]
