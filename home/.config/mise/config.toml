#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.6"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
self_update.auto = true
disable_backends = [
  "asdf",
  "conda",
  "dotnet",
  "forgejo",
  "gem",
  "gitlab",
  "s3",
  "ubi",
  "vfox",
]

[env]
_.path = [
  "~/.local/bin",
  { path = [
    "/opt/homebrew/bin",
    "/opt/homebrew/sbin",
  ], position = "append" },
]

MISE_BREW_CASK_OPT_APPDIR = "$HOME/Applications"

[tools]
node = "lts"
uv = "latest"

[bootstrap.packages]
"brew:git" = "latest"
"brew:bat" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:jq" = "latest"
"brew:fd" = "latest"
"brew:ripgrep" = "latest"
"brew:shellcheck" = "latest"
"brew:zoxide" = "latest"
"brew:agent-browser" = "latest"
"brew:mole" = "latest"
"brew:rtk" = "latest"
"brew:starship" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

[bootstrap.macos.dock]
tilesize = 48
autohide = true
show_recents = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
sort_folders_first = true

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = { NSTableViewDefaultSizeMode = 3 }

"com.apple.finder" = { FXDefaultSearchScope = "SCcf" }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
"com.apple.spaces" = { "spans-displays" = false }
"com.apple.ActivityMonitor" = { OpenMainWindow = true, ShowCategory = 0, SortColumn = "CPUUsage" }

[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"
