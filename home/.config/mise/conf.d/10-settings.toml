[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
self_update.auto = true

disable_backends = [
  "asdf",
  "conda",
  "dotnet",
  "forgejo",
  "gem",
  "gitlab",
  "s3",
  "ubi",
  "vfox",
]

dotfiles.root = "{{ config_source | canonicalize | dirname }}/../../.." #<repo>/home

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.write_targets]
tools = "{{ config_source | canonicalize | dirname }}/40-tools.toml"       # ~/.config/mise/conf.d/40-tools.toml
packages = "{{ config_source | canonicalize | dirname }}/40-tools.toml"    # ~/.config/mise/conf.d/40-tools.toml
dotfiles = "{{ config_source | canonicalize | dirname }}/30-dotfiles.toml" # ~/.config/mise/conf.d/30-dotfiles.toml
