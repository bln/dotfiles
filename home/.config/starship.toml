# Keep the prompt compact while preserving path, Git context, and command result.
palette = "catppuccin_frappe"
format = "[╭─](prompt) $directory$git_branch$git_status\n[╰─](prompt)$character "
add_newline = false

[palettes.catppuccin_frappe]
prompt = "#c6d0f5"
muted = "#838ba7"
dir = "#8caaee"
branch = "#ca9ee6"
status = "#e5c890"
success = "#a6d189"
error = "#e78284"

[directory]
format = "[$path]($style)"
style = "dir"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = " "
format = "  [$symbol$branch]($style)"
style = "branch"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "status"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](success)"
error_symbol = "[✘](error)"
vimcmd_symbol = "[❮](success)"
