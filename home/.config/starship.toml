# Keep the prompt compact while preserving path, Git context, and command result.
palette = "mini-onedark"
format = "[╭─](prompt) $directory$git_branch$git_status\n[╰─](prompt)$character "
add_newline = false

[palettes.mini-onedark]
prompt = "#abb2bf"
muted = "#5c6370"
dir = "#61afef"
branch = "#c678dd"
status = "#e5c07b"
success = "#98c379"
error = "#e06c75"

[palettes.mini-gruvbox]
prompt = "#ebdbb2"
muted = "#928374"
dir = "#83a598"
branch = "#d3869b"
status = "#fabd2f"
success = "#b8bb26"
error = "#fb4934"

[directory]
format = "[$path]($style)"
style = "dir"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = " "
format = "  [$symbol$branch]($style)"
style = "branch"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "status"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](success)"
error_symbol = "[✘](error)"
vimcmd_symbol = "[❮](success)"
