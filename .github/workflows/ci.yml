name: Configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_CONFIG_DIR: ${{ github.workspace }}/home/.config/mise

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Check shell syntax
        run: |
          bash -n uninstall.sh
          zsh -n home/.zshenv home/.zprofile home/.zshrc

      - name: Check native shell startup
        run: |
          test_home="$(mktemp -d)"
          cp home/.zshenv home/.zprofile home/.zshrc "$test_home/"
          printf '%s\n' 'NATIVE_LOCAL_LOADED=1' > "$test_home/.zshrc.local"
          env -i HOME="$test_home" PATH=/usr/bin:/bin TERM=xterm-256color \
            /bin/zsh -lic '
              [[ -z ${XDG_CONFIG_HOME+x}${XDG_CACHE_HOME+x}${XDG_DATA_HOME+x}${XDG_STATE_HOME+x}${ZDOTDIR+x}${NPM_CONFIG_USERCONFIG+x} ]] || exit 1
              [[ $HISTFILE == $HOME/.zsh_history ]] || exit 1
              [[ $_comp_dumpfile == $HOME/.zcompdump ]] || exit 1
              [[ $NATIVE_LOCAL_LOADED == 1 ]] || exit 1
              (( ${path[(Ie)$HOME/.local/bin]} )) || exit 1
            '
          env -i HOME="$test_home" PATH=/usr/bin:/bin /bin/zsh -c '
            [[ -z ${XDG_CONFIG_HOME+x}${XDG_CACHE_HOME+x}${XDG_DATA_HOME+x}${XDG_STATE_HOME+x}${ZDOTDIR+x}${NPM_CONFIG_USERCONFIG+x} ]] || exit 1
            (( ${path[(Ie)$HOME/.local/bin]} )) || exit 1
          '

      - name: Check Mise configuration
        run: |
          mise config get --global >/dev/null
          mise config explain dotfile_groups.home >/dev/null
          dotfiles_root="$(mise settings dotfiles.root)"
          test "$(cd "$dotfiles_root" && pwd -P)" = "$(pwd -P)"
          test -f home/.config/mise/mise.lock

      - name: Check dotfile bootstrap
        run: mise bootstrap --dry-run --yes --skip packages,services,user

      - name: Check TOML and strict JSON
        run: |
          mise exec -- uv run --no-project --python '>=3.11' python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          for root in (Path("home"), Path("patches")):
              for path in root.rglob("*.toml"):
                  tomllib.loads(path.read_text())
              for path in root.rglob("*.json"):
                  # Zed accepts JSONC, including trailing commas.
                  if path.is_relative_to(Path("home/.config/zed")):
                      continue
                  json.loads(path.read_text())
          tomllib.loads(Path("home/.config/mise/mise.lock").read_text())
          PY

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
