name: ci

# Lint and test the repo's shell scripts. This is the CI-appropriate subset of
# `mise run verify`: it deliberately skips the machine-state checks (bootstrap
# status, dotfiles status, brew bundle check) that only make sense on a
# converged macOS host, and runs only the host-independent gates.
#
# CI invokes the repo's own mise tasks as the canonical check, guaranteeing
# CI and local `mise run` always exercise the same code path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pin checkout to a specific commit SHA for supply-chain hardening.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=2026.9.5 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trust configuration
        run: |
          mise trust home/.config/mise/config.toml
          mise trust mise.toml
          mise trust home/.config/mise/tasks

      - name: Lint (bash -n + shellcheck)
        run: mise run lint

      - name: Validate mise configuration
        run: MISE_CONFIG_FILE="$PWD/home/.config/mise/config.toml" mise config ls >/dev/null

      - name: Test (script harness)
        run: mise run test

  # Bootstrap dry-run: validates the config parses and the plan is computable
  # without actually installing anything. Runs only on macOS since bootstrap
  # resources reference macOS-specific paths and packages.
  bootstrap-plan:
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=2026.9.5 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trust and validate bootstrap plan
        run: |
          mise trust home/.config/mise/config.toml
          mise trust mise.toml
          mise trust home/.config/mise/tasks
          MISE_CONFIG_FILE="$PWD/home/.config/mise/config.toml" mise bootstrap --dry-run

  # TypeScript syntax check: validates friendly-footer.ts compiles (syntax +
  # structure) without requiring the Pi SDK, which is not available in CI.
  # --noResolve prevents TypeScript from resolving @earendil-works/* from
  # node_modules; --skipLibCheck skips lib.d.ts declarations. Together they
  # catch syntax errors and intra-file type errors while staying Pi-SDK-free.
  typecheck:
    name: TypeScript syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check friendly-footer.ts
        run: |
          npx --yes typescript tsc \
            --noEmit \
            --target ES2022 \
            --module esnext \
            --moduleResolution bundler \
            --skipLibCheck \
            --noResolve \
            home/.pi/agent/extensions/friendly-footer.ts
