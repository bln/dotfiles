name: ci

# Lint and test the repo's shell scripts. This is the CI-appropriate subset of
# `mise run verify`: it deliberately skips the machine-state checks (bootstrap
# status, dotfiles status, brew bundle check) that only make sense on a
# converged macOS host, and runs only the host-independent gates.
#
# CI invokes the repo's own mise tasks as the canonical check, guaranteeing
# CI and local `mise run` always exercise the same code path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pin checkout to a specific commit SHA for supply-chain hardening.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      # No MISE_VERSION pin: config.toml min_version is the single source of truth
      # for the mise floor; installing latest always satisfies it (see docs/TESTING.md).
      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trust configuration
        run: |
          mise trust home/.config/mise/config.toml
          mise trust mise.toml

      - name: Validate mise configuration
        run: MISE_CONFIG_FILE="$PWD/home/.config/mise/config.toml" mise config ls >/dev/null

      - name: Test (script harness)
        run: mise run test

  # Bootstrap dry-run: validates the config parses and the plan is computable
  # without actually installing anything. Runs only on macOS since bootstrap
  # resources reference macOS-specific paths and packages.
  bootstrap-plan:
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The machine config intentionally roots dotfile sources at ~/dotfiles/home
      # (see install.sh, which refuses any other checkout location). CI checks out
      # elsewhere, so symlink the checkout to ~/dotfiles before the dry-run to
      # resolve every [dotfiles] source exactly as a real machine would.
      - name: Trust and validate bootstrap plan
        run: |
          ln -sfn "$PWD" "$HOME/dotfiles"
          mise trust home/.config/mise/config.toml
          mise trust mise.toml
          MISE_CONFIG_FILE="$PWD/home/.config/mise/config.toml" mise bootstrap --dry-run
