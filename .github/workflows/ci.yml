name: Configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_CONFIG_DIR: ${{ github.workspace }}/home/.config/mise

jobs:
  check:
    name: Check
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Check shell syntax
        run: |
          bash -n install.sh uninstall.sh
          zsh -n home/.zshenv home/.config/zsh/.zprofile home/.config/zsh/.zshrc

      - name: Check Git configuration
        run: |
          git config --file home/.config/git/config --list >/dev/null
          git config --file home/.config/git/identity-personal.example --list >/dev/null
          git config --file home/.config/git/identity-work.example --list >/dev/null

      - name: Check Mise configuration
        run: |
          mise config get --global >/dev/null
          mise config explain --global dotfile_groups.home >/dev/null
          mise shell-alias get gcm >/dev/null
          dotfiles_root="$(mise settings dotfiles.root)"
          test "$(cd "$dotfiles_root" && pwd -P)" = "$(cd home && pwd -P)"
          test -f home/.config/mise/mise.lock

      - name: Check dotfile bootstrap
        run: mise bootstrap --dry-run --yes --skip packages,services,user

      - name: Check whitespace
        run: git diff --check HEAD
