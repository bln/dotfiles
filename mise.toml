#:schema https://mise.jdx.dev/schema/mise.json
# Repo-local mise tasks for this checkout.

# ── verification pipeline ─────────────────────────────────────────────────────
# verify runs machine-state checks first (sequential - order matters), then
# host-independent checks in parallel, then reports success.
#
# check:git-identity and check:vscode-symlink are file tasks under
# .mise/tasks/check/. They guard real failures (blocked commits, divorced VSCode
# settings), so they live as scripts with test seams (HOME; VSCODE_SETTINGS_*)
# that tests/run.sh exercises against sandboxes - not inline TOML.

[tasks."verify:machine-state"]
description = "sequential machine-state checks (mise health, bootstrap, packages)"
run = [
  # doctor first: fail fast if the installation itself is unhealthy (deactivated,
  # shims off PATH, config unparseable) rather than reporting confusing drift.
  "mise doctor",
  "mise bootstrap status --missing",
  "mise dotfiles status --missing",
  "mise bootstrap packages status --missing",
  'env PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH" brew bundle check --file "$HOME/.config/homebrew/Brewfile" --no-upgrade',
]

[tasks.verify]
description = "verify declared machine state"
depends = [
  "verify:machine-state",
  ["lint", "test", "check:vscode-symlink", "check:git-identity"],
]
run = "echo 'OK: dotfiles verification passed.'"

[tasks.lint]
description = "syntax-check and shellcheck every shell script in the repo"
dir = "{{ config_root }}"
run = "bash scripts/lint-shell.sh"

[tasks.test]
description = "run the shell script test harness against mktemp sandboxes"
dir = "{{ config_root }}"
run = "bash tests/run.sh"
