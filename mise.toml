#:schema https://mise.jdx.dev/schema/mise.json
# Project configuration for this repository's dotfile deployment.

min_version = "2026.10.24"

[settings]
dotfiles.default_mode = "symlink"
dotfiles.relative_symlinks = true

[dotfiles]
"~" = {
  source = "home",
mode = "symlink-each",
manifest = "git",
}

# Keep user-created identity contents local while enforcing restrictive
# permissions.
"~/.config/git/identity-personal" = { permissions = "0600" }
"~/.config/git/identity-work" = { permissions = "0600" }
