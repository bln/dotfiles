#:schema https://mise.jdx.dev/schema/mise.json
# Repo-local mise config and tasks for this dotfiles checkout.
# Run from anywhere: dot run <task>  (dot alias = mise -C ~/dotfiles)

[task_config]
# File tasks live in tasks/ (top-level, not shipped to $HOME).
includes = ["tasks"]

# ── verification pipeline ──────────────────────────────────────────────────────
# verify runs sequentially: machine-state checks first (fail fast on unhealthy
# installation), then test (lint + harness), then machine-local guard scripts.

[tasks.verify]
description = "verify declared machine state"
dir = "{{ config_root }}"
run = [
  # machine-state first: fail fast on unhealthy installation or drift.
  "mise doctor",
  "mise -q bootstrap plan --detailed-exitcode",
  # host-independent: lint + test harness.
  "mise run test",
  # host-coupled behavioral checks (tools on PATH, plugins loaded).
  "bash tests/run.sh host",
  # machine-local guard scripts.
  'bash "{{ config_root }}/scripts/check-git-identity.sh"',
  # all copy-managed drift (dotfiles + VS Code) via the single diff task; it
  # gates on `dotfiles status --missing` (nonzero on missing OR content drift).
  "mise run diff",
  "echo 'OK: dotfiles verification passed.'",
]

[tasks.test]
description = "lint and test all shell scripts"
dir = "{{ config_root }}"
run = ["bash scripts/lint-shell.sh", "bash tests/run.sh"]

# ── sync:vscode ──────────────────────────────────────────────────────────────
# Run from anywhere: dot run sync:vscode  (add --prune to remove undeclared exts)
# Single entry point for applying VS Code profiles (seed named profiles, push
# profile files, install declared extensions). bootstrap and update call this so
# the apply invocation lives in one place. Seeding mutates storage.json, so it
# refuses to run while VS Code is open (pass --force via the env seam to override).

[tasks."sync:vscode"]
description = "sync VS Code profiles: seed, push files, install extensions (--prune removes undeclared)"
dir = "{{ config_root }}"
usage = 'flag "--prune" help="Uninstall extensions installed but not declared"'
run = 'bash "{{ config_root }}/scripts/vscodectl" apply ${usage_prune:+--prune}'

# ── diff / converge: unified drift across all copy-managed resources ──────────
# diff reports drift, converge fixes it - covering symlink dotfiles, copy-mode
# dotfiles, AND VS Code profiles/extensions in one place, split by intent
# (check vs fix) rather than by resource. The model is push-only: the repo is
# the sole authority, apply overwrites live edits with no merge. mise's history
# (save/watch) and sharing (origin/sync/pull) tiers are deliberately NOT used -
# git is the only cross-machine channel.

[tasks.diff]
description = "report drift between declared and live state (dotfiles + VS Code)"
dir = "{{ config_root }}"
# Report ALL drift, then fail if any exists. mise aborts an array on the first
# nonzero step, so we cannot put a gate before the informational output or it
# would hide the rest. Order: print the readable dotfiles patch first (always
# exits 0), then a single step that runs BOTH drift gates - `dotfiles status
# --missing` (nonzero on a missing/content-drifted entry) and `vscodectl
# check` (nonzero on VS Code drift) - and exits nonzero if either found drift.
# Both run regardless of the other's result, so a drifted machine still gets a
# full report and verify (which delegates here) still gates on VS Code drift.
run = [
  "mise dotfiles diff",
  'st=0; mise dotfiles status --missing || st=1; bash "{{ config_root }}/scripts/vscodectl" check || st=1; exit $st',
]

[tasks.converge]
description = "apply declared state to the machine (dotfiles + VS Code); repo is authority"
dir = "{{ config_root }}"
usage = 'flag "--prune" help="Uninstall VS Code extensions installed but not declared"'
# Composes sync:vscode for the VS Code half so the apply invocation stays in one
# place. NOTE: bootstrap does NOT route through converge - it must sequence
# setup:rtk between the dotfiles apply and the VS Code apply (rtk restores the
# copy-managed Codex AGENTS.md that apply writes), so it keeps its own steps.
# dotfiles apply is best-effort so a transient apply error still lets the VS
# Code sync run (mirrors bootstrap's best-effort vscode step); it still prints
# the failure.
run = [
  "mise dotfiles apply --yes || echo 'WARNING: dotfiles apply reported errors; continuing converge' >&2",
  "mise run sync:vscode ${usage_prune:+--prune}",
]

# ── bootstrap ──────────────────────────────────────────────────────────────────

[tasks.bootstrap]
description = "finish bootstrap: install VS Code extensions and uv default python"
run = [
  # Apply dotfiles. Under install.sh this is the second apply (mise bootstrap
  # phase 4 already linked them with --force-dotfiles) and a no-op. It earns its
  # place for the standalone `mise run bootstrap` path, which is ONLY this task -
  # no phase 4 - so this step is then the sole thing that links the payload.
  "mise dotfiles apply --yes",
  # setup:rtk runs after apply: it registers machine-local transparent hooks
  # (Claude + Codex PreToolUse, Pi extension) that don't depend on the just-
  # applied instruction files, and it restores the copy-managed Codex AGENTS.md
  # after rtk's init touches it.
  "mise run setup:rtk",
  # apply is best-effort here: a transient extension-install failure returns
  # nonzero but must not abort the rest of the converge (verify's `check` is the
  # strict gate). It still prints the failure.
  "mise run sync:vscode || echo 'WARNING: VS Code sync reported errors; continuing bootstrap' >&2",
  # `--default` creates the unversioned ~/.local/bin/python symlink; a plain
  # install does not. Guard on that so re-runs stay quiet and idempotent.
  "uv python find python >/dev/null 2>&1 || uv python install --default --preview-features python-install-default",
]

# ── teardown ─────────────────────────────────────────────────────────────────
# Run from anywhere: dot run teardown  (add --apply to execute)

[tasks.teardown]
description = "remove repository-owned state (dry-run; pass --apply to execute)"
dir = "{{ config_root }}"
usage = 'flag "--apply" help="Execute removals (default: dry-run preview)"'
# Load-bearing order. The two commands that can't be task steps - `mise uninstall
# --all` (re-shims the runner mid-array) and `mise implode` (self-deletes mise) -
# are printed as manual next steps instead.
run = [
  # rtk first, before dotfiles unapply: rtk teardown strips its hook edits and
  # restores the copy-managed Codex AGENTS.md, which unapply then removes -
  # correct empty end state and no resurrection race. Best-effort: a failed
  # uninstall warns but must not stop the remaining steps.
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/tasks/teardown/rtk" || echo "WARNING: RTK teardown reported errors; continuing" >&2',
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/scripts/teardown-dotfiles.sh"',
  # packages: prune repo-declared brew/cask packages through mise (the installer),
  # never a direct brew call. mise removes what it can prove it owns (formulae,
  # simple casks) and declines the rest (mas apps, lifecycle/unprovable casks)
  # with a printed reason. Best-effort: a decline is not a teardown failure.
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/scripts/teardown-packages.sh" || echo "WARNING: package prune reported errors; continuing" >&2',
  # vscode teardown is best-effort: a failed uninstall returns nonzero but must
  # not stop the remaining teardown steps (identity/uv cleanup below).
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/scripts/vscodectl" teardown || echo "WARNING: VS Code teardown reported errors; continuing" >&2',
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/scripts/teardown-local.sh"',
  'printf "\n== teardown %s ==\n  Then finish manually (removes mise itself):\n    mise uninstall --all --yes\n    mise implode --config --yes\n" "$([ "${usage_apply:-false}" = true ] && echo COMPLETE || echo PREVIEW)"',
]

# ── update ─────────────────────────────────────────────────────────────────────
# Run from anywhere: dot run update

[tasks.update]
description = "upgrade everything: mise, tools, packages, VS Code extensions, python, dotfiles"
interactive = true
run = [
  # mise runs each array step as a fresh process, so self-updating the binary
  # first is safe: every later `mise ...` step re-execs the new binary.
  "mise self-update --yes",
  # tools: re-resolve `latest`, bump versions in config.toml, rewrite mise.lock.
  "mise upgrade --bump --yes",
  # packages: refresh metadata + install any newly-declared packages. `apply`
  # (what --update runs) is install-only: it does NOT upgrade what's already
  # installed, so it needs the explicit upgrade step below.
  "mise bootstrap --update --only packages --yes",
  # upgrade installed brew FORMULAE to their current bottles. Casks (brew-cask)
  # and mas are excluded on purpose: those GUI apps self-update, mise skips a
  # cask whose app is already newer, and their versions aren't tracked in
  # mise.lock - so there is no pin to reconcile and nothing to gain here.
  "mise bootstrap packages upgrade --manager brew --yes",
  # VS Code + dotfiles: converge declared state onto the machine (install
  # missing extensions, prune undeclared, apply dotfiles). Extension *upgrades*
  # are left to VS Code itself (extensions.autoCheckUpdates=true in the base
  # settings), matching how casks/mas apps self-update - so converge only
  # reconciles declared-vs-installed, never versions, and pays no slow
  # marketplace round-trip per converge. Best-effort: a transient sync failure
  # warns but must not abort the remaining upgrade steps.
  "mise run converge --prune || echo 'WARNING: converge reported errors; continuing update' >&2",
  "uv python upgrade",
]
