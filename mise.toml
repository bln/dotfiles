#:schema https://mise.jdx.dev/schema/mise.json
# Repo-local mise config and tasks for this dotfiles checkout.
# Run from anywhere: dot run <task>  (dot alias = mise -C ~/dotfiles)

[task_config]
# includes replaces the default file-task search paths, so list both:
# tasks/       -- repo-local setup scripts
# .mise/tasks/ -- kept for future file tasks
includes = ["tasks", ".mise/tasks"]

# ── verification pipeline ──────────────────────────────────────────────────────
# verify runs sequentially: machine-state checks first (fail fast on unhealthy
# installation), then test (lint + harness), then machine-local guard scripts.

[tasks.verify]
description = "verify declared machine state"
dir = "{{ config_root }}"
run = [
  # machine-state first: fail fast on unhealthy installation or drift.
  "mise doctor",
  "mise -q bootstrap plan --detailed-exitcode",
  # host-independent: lint + test harness.
  "mise run test",
  # machine-local guard scripts.
  'bash "{{ config_root }}/scripts/check-git-identity.sh"',
  'bash "{{ config_root }}/scripts/check-vscode-symlink.sh"',
  "echo 'OK: dotfiles verification passed.'",
]

[tasks.test]
description = "lint and test all shell scripts"
dir = "{{ config_root }}"
sources = ["**/*.sh", "tasks/**", ".mise/tasks/**", "scripts/**", "tests/**"]
run = ["bash scripts/lint-shell.sh", "bash tests/run.sh"]

# ── bootstrap ──────────────────────────────────────────────────────────────────

[tasks.bootstrap]
description = "finish bootstrap: install VS Code extensions and uv default python"
run = [
  'bash "{{ config_root }}/scripts/apply-vscode-extensions.sh"',
  "uv python find --default >/dev/null 2>&1 || uv python install --default --preview-features python-install-default",
]

# ── update ─────────────────────────────────────────────────────────────────────
# Run from anywhere: dot run update

[tasks.update]
description = "upgrade everything: mise, tools, packages, VS Code extensions, python, dotfiles"
interactive = true
run = [
  "mise self-update --yes",
  # --update upgrades already-installed items, not just missing ones.
  "mise bootstrap --update --only packages,tools",
  'bash "{{ config_root }}/scripts/apply-vscode-extensions.sh"',
  "mise bootstrap dotfiles apply",
  "uv python upgrade",
]


