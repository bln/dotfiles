#:schema https://mise.jdx.dev/schema/mise.json
# Repo-local mise config and tasks for this dotfiles checkout.
# Run from anywhere: dot run <task>  (dot alias = mise -C ~/dotfiles)

[task_config]
# File tasks live in tasks/ (top-level, not shipped to $HOME).
includes = ["tasks"]

# ── verification pipeline ──────────────────────────────────────────────────────
# verify runs sequentially: machine-state checks first (fail fast on unhealthy
# installation), then test (lint + harness), then machine-local guard scripts.

[tasks.verify]
description = "verify declared machine state"
dir = "{{ config_root }}"
run = [
  # machine-state first: fail fast on unhealthy installation or drift.
  "mise doctor",
  "mise -q bootstrap plan --detailed-exitcode",
  # host-independent: lint + test harness.
  "mise run test",
  # host-coupled behavioral checks (tools on PATH, plugins loaded).
  "bash tests/run.sh host",
  # machine-local guard scripts.
  'bash "{{ config_root }}/scripts/check-git-identity.sh"',
  "mise dotfiles status --missing",
  'bash "{{ config_root }}/scripts/vscode-profiles" check',
  "echo 'OK: dotfiles verification passed.'",
]

[tasks.test]
description = "lint and test all shell scripts"
dir = "{{ config_root }}"
run = ["bash scripts/lint-shell.sh", "bash tests/run.sh"]

# ── sync:vscode ──────────────────────────────────────────────────────────────
# Run from anywhere: dot run sync:vscode  (add --prune to remove undeclared exts)
# Single entry point for applying VS Code profiles (seed named profiles, push
# profile files, install declared extensions). bootstrap and update call this so
# the apply invocation lives in one place. Seeding mutates storage.json, so it
# refuses to run while VS Code is open (pass --force via the env seam to override).

[tasks."sync:vscode"]
description = "sync VS Code profiles: seed, push files, install extensions (--prune removes undeclared)"
dir = "{{ config_root }}"
usage = 'flag "--prune" help="Uninstall extensions installed but not declared"'
run = 'bash "{{ config_root }}/scripts/vscode-profiles" apply ${usage_prune:+--prune}'

# ── bootstrap ──────────────────────────────────────────────────────────────────

[tasks.bootstrap]
description = "finish bootstrap: install VS Code extensions and uv default python"
run = [
  "mise dotfiles apply --yes",
  "mise run setup:rtk",
  # apply is best-effort here: a transient extension-install failure returns
  # nonzero but must not abort the rest of the converge (verify's `check` is the
  # strict gate). It still prints the failure.
  "mise run sync:vscode || echo 'WARNING: VS Code sync reported errors; continuing bootstrap' >&2",
  # `--default` creates the unversioned ~/.local/bin/python symlink; a plain
  # install does not. Guard on that so re-runs stay quiet and idempotent.
  "uv python find python >/dev/null 2>&1 || uv python install --default --preview-features python-install-default",
]

# ── teardown ─────────────────────────────────────────────────────────────────
# Run from anywhere: dot run teardown  (add --apply to execute)

[tasks.teardown]
description = "remove repository-owned state (dry-run; pass --apply to execute)"
dir = "{{ config_root }}"
usage = 'flag "--apply" help="Execute removals (default: dry-run preview)"'
# Load-bearing order. The two commands that can't be task steps - `mise uninstall
# --all` (re-shims the runner mid-array) and `mise implode` (self-deletes mise) -
# are printed as manual next steps instead.
run = [
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/scripts/teardown-dotfiles.sh"',
  # vscode teardown is best-effort: a failed uninstall returns nonzero but must
  # not stop the remaining teardown steps (identity/uv cleanup below).
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/scripts/vscode-profiles" teardown || echo "WARNING: VS Code teardown reported errors; continuing" >&2',
  'APPLY="${usage_apply:-false}" bash "{{ config_root }}/scripts/teardown-local.sh"',
  'printf "\n== teardown %s ==\n  Then finish manually (removes mise itself):\n    mise uninstall --all --yes\n    mise implode --config --yes\n" "$([ "${usage_apply:-false}" = true ] && echo COMPLETE || echo PREVIEW)"',
]

# ── update ─────────────────────────────────────────────────────────────────────
# Run from anywhere: dot run update

[tasks.update]
description = "upgrade everything: mise, tools, packages, VS Code extensions, python, dotfiles"
interactive = true
run = [
  # mise runs each array step as a fresh process, so self-updating the binary
  # first is safe: every later `mise ...` step re-execs the new binary.
  "mise self-update --yes",
  # tools: re-resolve `latest`, bump versions in config.toml, rewrite mise.lock.
  "mise upgrade --bump --yes",
  # packages: refresh metadata + install any newly-declared packages. `apply`
  # (what --update runs) is install-only: it does NOT upgrade what's already
  # installed, so it needs the explicit upgrade step below.
  "mise bootstrap --update --only packages --yes",
  # upgrade installed brew FORMULAE to their current bottles. Casks (brew-cask)
  # and mas are excluded on purpose: those GUI apps self-update, mise skips a
  # cask whose app is already newer, and their versions aren't tracked in
  # mise.lock - so there is no pin to reconcile and nothing to gain here.
  "mise bootstrap packages upgrade --manager brew --yes",
  # VS Code: sync declared profiles (install missing, prune undeclared). Extension
  # *upgrades* are left to VS Code itself (extensions.autoCheckUpdates=true in the
  # base settings), matching how casks/mas apps self-update - so there is no CLI
  # update step to pay a slow marketplace round-trip on every converge. Best-effort:
  # a transient sync failure warns but must not abort the remaining upgrade steps.
  "mise run sync:vscode --prune || echo 'WARNING: VS Code sync reported errors; continuing update' >&2",
  "mise dotfiles apply --yes",
  # setup:rtk is NOT re-run here: `rtk init` is idempotent (self-detects and
  # no-ops when the hook/extension are already configured), so re-running it on
  # every update only adds noise. bootstrap configures it once; re-run
  # `mise run setup:rtk` by hand if an rtk version bump ever changes its format.
  "uv python upgrade",
]
