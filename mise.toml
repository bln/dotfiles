#:schema https://mise.jdx.dev/schema/mise.json
# Repo-local mise config and tasks for this dotfiles checkout.
# Run from anywhere: dot run <task>  (dot alias = mise -C ~/dotfiles)

[task_config]
# includes replaces the default file-task search paths, so list both:
# tasks/       -- repo-local setup + reset scripts
# .mise/tasks/ -- check:git-identity, check:vscode-symlink
includes = ["tasks", ".mise/tasks"]

# ── verification pipeline ──────────────────────────────────────────────────────
# verify runs machine-state checks first (sequential - order matters), then
# host-independent checks in parallel, then reports success.
#
# check:git-identity and check:vscode-symlink are file tasks under
# .mise/tasks/check/. They guard real failures (blocked commits, divorced VSCode
# settings), so they live as scripts with test seams that tests/run.sh exercises.

[tasks."verify:machine-state"]
description = "sequential machine-state checks"
run = [
  # doctor first: fail fast if the installation itself is unhealthy.
  "mise doctor",
  # plan covers all phases (dotfiles, packages, tools); exits 2 on any drift.
  "mise -q bootstrap plan --detailed-exitcode",
]

[tasks.verify]
description = "verify declared machine state"
depends = [
  "verify:machine-state",
  ["lint", "test", "check:vscode-symlink", "check:git-identity"],
]
run = "echo 'OK: dotfiles verification passed.'"

[tasks.lint]
description = "syntax-check and shellcheck every shell script in the repo"
dir = "{{ config_root }}"
sources = ["**/*.sh", "tasks/**", ".mise/tasks/**", "scripts/**"]
run = "bash scripts/lint-shell.sh"

[tasks.test]
description = "run the shell script test harness against mktemp sandboxes"
dir = "{{ config_root }}"
sources = ["**/*.sh", "tasks/**", ".mise/tasks/**", "tests/**"]
run = "bash tests/run.sh"

# ── bootstrap ──────────────────────────────────────────────────────────────────

[tasks.bootstrap]
description = "finish bootstrap: install VS Code extensions and uv default python"
run = [
  'bash "{{ config_root }}/scripts/apply-vscode-extensions.sh"',
  "uv python find --default >/dev/null 2>&1 || uv python install --default --preview-features python-install-default",
]

# ── update ─────────────────────────────────────────────────────────────────────
# Run from anywhere: dot run update

[tasks.update]
description = "upgrade everything: mise, tools, packages, VS Code extensions, python, dotfiles"
interactive = true
run = [
  "mise self-update --yes",
  # --update upgrades already-installed items, not just missing ones.
  "mise bootstrap --update --only packages,tools",
  'bash "{{ config_root }}/scripts/apply-vscode-extensions.sh"',
  "mise bootstrap dotfiles apply",
  "uv python upgrade",
]

# ── check tasks ────────────────────────────────────────────────────────────────

[tasks."check:drift"]
description = "show pending dotfile changes (diff vs deployed state)"
run = "mise bootstrap dotfiles diff"

# ── reset tasks ────────────────────────────────────────────────────────────────
# reset-codex is a file task: tasks/reset-codex

[tasks.reset-claude]
description = "clear all Claude Code project sessions"
run = "claude project purge --all"

[tasks.reset-pi]
description = "clear all Pi coding-agent sessions"
run = "rm -rf \"$HOME/.pi/agent/sessions\""

[tasks.reset-all]
description = "clear all Claude Code, Codex, and Pi sessions"
depends = ["reset-claude", "reset-codex", "reset-pi"]
