#:schema https://mise.jdx.dev/schema/mise.json
# Project configuration for this repository's dotfile deployment.

min_version = "2026.10.0"

[settings]
dotfiles.default_mode = "symlink"
dotfiles.relative_symlinks = true

[bootstrap.secrets]
git_personal_name = {
  env = "GIT_PERSONAL_NAME",
description = "Personal Git user name",
}
git_personal_email = {
  env = "GIT_PERSONAL_EMAIL",
description = "Personal Git email",
}
git_work_name = {
  env = "GIT_WORK_NAME",
description = "Work Git user name",
}
git_work_email = {
  env = "GIT_WORK_EMAIL",
description = "Work Git email",
}

[dotfiles]
"~" = {
  source = "home",
mode = "symlink-each",
manifest = "git",
}

"~/.config/git/identity-personal" = {
  source = "templates/git/identity-personal.tmpl",
mode = "template",
permissions = "0600",
}

"~/.config/git/identity-work" = {
  source = "templates/git/identity-work.tmpl",
mode = "template",
permissions = "0600",
}
